name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint, types, and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: bds
          POSTGRES_USER: bds
          POSTGRES_PASSWORD: bds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bds -d bds"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.4.8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret-0123456789abcdefghijklmnopqrstuvwxyz-ABCDEF
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: example.com
      DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DATABASE_URL: postgresql://bds:bds@localhost:5432/bds
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.8"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/dev.txt

      - name: Dependency audit
        run: pip-audit -r requirements/base.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy .

      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Deployment check baseline
        run: python manage.py check --deploy --settings=config.settings.prod --fail-level ERROR

      - name: OpenAPI schema validation
        run: python manage.py spectacular --file schema.yaml --validate

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Tests with coverage
        run: pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: Frontend (activated in Phase 5)
    if: ${{ hashFiles('frontend/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck --if-present

      - name: Unit tests
        run: npm test --if-present

      - name: Production build
        run: npm run build
